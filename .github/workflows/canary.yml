name: Canary Snapshot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  canary:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/canary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: PRのHEADをチェックアウト
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@kentem-ka-hashimoto'

      - run: npm ci
      - run: npm run build

      - name: スナップショットバージョンを付与
        run: npx changeset version --snapshot canary

      - name: パッケージ情報を取得
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: publish
        run: npx changeset publish --tag canary --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: コメント本文を生成
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          {
            echo "スナップショットを発行しました。"
            echo ""
            echo '```bash'
            echo "npm i ${PKG_NAME}@${PKG_VERSION}"
            echo '```'
            echo ""
            echo "このバージョンは \`canary\` タグで公開されています。\`latest\` は変更されていません。"
          } > comment.md

      - name: PRにインストールコマンドを投稿
        run: gh pr comment "${{ github.event.issue.number }}" --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}